# Many-to-many join: user ↔ role (first-class object with its own UUID PK).
name: user_role
display_name: User Role
description: >
  Assignment of a role to a user. Idempotent seed uses stable join row ids;
  composite uniqueness is enforced by a unique index on (user_id, role_id).
unique:
  - [user_id, role_id]
attributes:
  user_id:
    type: uuid
    required: true
    references: user
  role_id:
    type: uuid
    required: true
    references: role
