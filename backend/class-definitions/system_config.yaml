# System Configuration — environment-local, non-sensitive runtime parameters.
# Future class tier: system (#116). Tier field not invented here.
name: system_config
display_name: System Configuration
description: >
  Singleton holding general system settings operators may tune per deployment
  without a Git promote cycle. Safe for authenticated read (public: true).
  Search-limit attributes are the initial contents; the class is expected to
  grow. Secrets must not live here.
public: true
permissions:
  - read
  - update
check_constraint:
  - "id = '${system_config_id}'::uuid"
  - "password_maximum_chars > password_minimum_chars"
  - "login_process_time_minimum <= login_process_time_maximum"
  - "session_refresh_reuse_window_seconds > session_refresh_reuse_grace_seconds"
  - "session_refresh_process_time_minimum <= session_refresh_process_time_maximum"
attributes:
  max_search_nesting_depth:
    type: integer
    required: true
    create_default: 3
    min_value: 1
    max_value: 10
  max_search_nesting_length:
    type: integer
    required: true
    create_default: 20
    min_value: 1
    max_value: 100
  max_search_total_predicates:
    type: integer
    required: true
    create_default: 50
    min_value: 1
    max_value: 500
  max_search_total_regexp:
    type: integer
    required: true
    create_default: 3
    min_value: 0
    max_value: 20
  system_config_cache_ttl_seconds:
    type: integer
    required: true
    create_default: 900
    min_value: 1
    max_value: 86400
  password_minimum_chars:
    type: integer
    required: true
    create_default: 12
    min_value: 1
    max_value: 256
  password_maximum_chars:
    type: integer
    required: true
    create_default: 128
    min_value: 1
    max_value: 256
  password_acceptable_crack_time_days:
    type: integer
    required: true
    create_default: 1000
    min_value: 100
    max_value: 1000000
  password_guess_per_second:
    type: integer
    required: true
    create_default: 10000
    min_value: 100
    max_value: 1000000
  password_estimate_drift_factor:
    type: decimal
    required: true
    create_default: 1.1
    min_value: 1
    max_value: 10
  password_expiry_days:
    type: integer
    required: true
    create_default: 90
    min_value: 3
  password_grace_days:
    type: integer
    required: true
    create_default: 14
    min_value: 3
  login_process_time_minimum:
    type: integer
    required: true
    create_default: 300
    min_value: 100
  login_process_time_maximum:
    type: integer
    required: true
    create_default: 500
    min_value: 200
  login_hash_concurrency_limit:
    type: integer
    required: true
    create_default: 4
    min_value: 1
    max_value: 10
  login_maximum_failed_count:
    type: integer
    required: true
    create_default: 5
    min_value: 1
  login_rate_limit_per_user_threshold:
    type: integer
    required: true
    create_default: 10
    min_value: 1
  login_rate_limit_per_user_sample_period:
    type: integer
    required: true
    create_default: 300
    min_value: 1
  login_rate_limit_per_ip_threshold:
    type: integer
    required: true
    create_default: 10
    min_value: 1
  login_rate_limit_per_ip_sample_period:
    type: integer
    required: true
    create_default: 300
    min_value: 1
  login_rate_limit_l1_delay:
    type: integer
    required: true
    create_default: 500
    min_value: 0
  login_rate_limit_l2_delay:
    type: integer
    required: true
    create_default: 2000
    min_value: 0
  login_rate_limit_lockout_seconds:
    type: integer
    required: true
    create_default: 900
    min_value: 1
  login_rate_limit_max_kib:
    type: integer
    required: true
    create_default: 16384
    min_value: 8192
    max_value: 262144
  audit_bulk_read_window_seconds:
    type: integer
    required: true
    create_default: 600
    min_value: 60
    max_value: 86400
  audit_bulk_read_max_searches:
    type: integer
    required: true
    create_default: 100
    min_value: 1
    max_value: 100000
  session_access_ttl_seconds:
    type: integer
    required: true
    create_default: 900
    min_value: 60
    max_value: 86400
  session_refresh_ttl_seconds:
    type: integer
    required: true
    create_default: 604800
    min_value: 300
    max_value: 7776000
  session_total_ttl_seconds:
    type: integer
    required: true
    create_default: 2592000
    min_value: 300
    max_value: 15552000
  session_refresh_reuse_grace_seconds:
    type: integer
    required: true
    create_default: 15
    min_value: 5
    max_value: 60
  session_refresh_reuse_window_seconds:
    type: integer
    required: true
    create_default: 86400
    min_value: 3600
    max_value: 604800
  session_max_refresh_retries:
    type: integer
    required: true
    create_default: 5
    min_value: 1
    max_value: 10
  session_refresh_cleanup_seconds:
    type: integer
    required: true
    create_default: 14400
    min_value: 3600
    max_value: 259200
  session_refresh_process_time_minimum:
    type: integer
    required: true
    create_default: 300
    min_value: 100
    max_value: 500
  session_refresh_process_time_maximum:
    type: integer
    required: true
    create_default: 500
    min_value: 200
    max_value: 1000
