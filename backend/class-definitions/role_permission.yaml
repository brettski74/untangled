# Many-to-many join: role ↔ permission (first-class object with its own UUID PK).
name: role_permission
display_name: Role Permission
description: >
  Grant of a permission to a role. Idempotent seed uses stable join row ids;
  composite uniqueness is enforced by a unique index on (role_id, permission_id).
unique:
  - [role_id, permission_id]
attributes:
  role_id:
    type: uuid
    required: true
    references: role
  permission_id:
    type: uuid
    required: true
    references: permission
