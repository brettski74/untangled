# Change Request — Phase 1 ITSM ticket.
name: change_request
display_name: Change Request
description: >
  Planned change record with a human-friendly CHG number. Status is a free
  string in M1; documented status vocabulary (progression) is draft →
  scheduled → in-progress → implemented → closed, plus terminal off-ramp
  cancelled.
permissions:
  - create
  - read
  - search
  - update
  - delete
attributes:
  number:
    type: friendly_id
    required: true
    prefix: CHG
  summary:
    type: text
    required: true
  description:
    type: multiline_text
    required: false
  status:
    type: status
    required: true
    create_default: draft
  risk_score:
    # Integer 0–100 inclusive (M1 convention; not range-enforced in the compiler yet).
    type: integer
    required: false
  scheduled_start:
    type: datetime
    required: true
  scheduled_end:
    type: datetime
    required: true
  actual_start:
    type: datetime
    required: false
  actual_end:
    type: datetime
    required: false
  assigned_user_id:
    type: uuid
    required: false
    references: user
  requested_by:
    type: uuid
    required: true
    references: user
    # M1 scoped debt: baseline seed-catalog admin UUID (SEED_ADMIN_ID).
    # Valid only when the intentional baseline seed is applied.
    # Prefer current-user substitution / FK picker when that follow-on lands —
    # do not copy this pattern to other actor-typed attributes.
    create_default: "01900000-0000-7000-8000-000000000001"
