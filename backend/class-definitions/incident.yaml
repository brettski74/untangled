# Incident — Phase 1 ITSM ticket.
name: incident
display-name: Incident
description: >
  Operational incident record with a human-friendly INC number. Status and
  severity are free strings in M1; documented status vocabulary (progression)
  is new → in-progress → resolved → closed, plus terminal off-ramp cancelled.
  Severity vocabulary: Critical, High, Medium, Low. Resolution-type vocabulary:
  User error, Application fault, Hardware fault, Network fault, Other.
attributes:
  number:
    type: friendly-id
    required: true
    prefix: INC
  summary:
    type: text
    required: true
  description:
    type: multiline-text
    required: false
  status:
    type: status
    required: true
    create-default: new
  severity:
    type: choice
    required: true
  major-incident:
    # Optional boolean is tri-state (NULL ≠ false). Prefer required+default when
    # schema defaults/backfill land (#62). Unset rows match neither eq true nor eq false.
    type: boolean
    required: false
  resolved-at:
    type: datetime
    required: false
  closed-at:
    type: datetime
    required: false
  assigned-user-id:
    type: uuid
    required: false
    references: user
  resolution:
    type: multiline-text
    required: false
  resolution-type:
    type: choice
    required: false
