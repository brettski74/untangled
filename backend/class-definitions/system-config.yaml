# System Configuration — environment-local, non-sensitive runtime parameters.
# Future class tier: system (#116). Tier field not invented here.
name: system-config
display-name: System Configuration
description: >
  Singleton holding general system settings operators may tune per deployment
  without a Git promote cycle. Safe for authenticated read (public: true).
  Search-limit attributes are the initial contents; the class is expected to
  grow. Secrets must not live here.
public: true
suppress-create: true
suppress-delete: true
suppress-search: true
check-constraint:
  - "id = '${system-config-id}'::uuid"
  - "password_maximum_chars > password_minimum_chars"
attributes:
  max-search-nesting-depth:
    type: integer
    required: true
    create-default: 3
    min-value: 1
    max-value: 10
  max-search-nesting-length:
    type: integer
    required: true
    create-default: 20
    min-value: 1
    max-value: 100
  max-search-total-predicates:
    type: integer
    required: true
    create-default: 50
    min-value: 1
    max-value: 500
  max-search-total-regexp:
    type: integer
    required: true
    create-default: 3
    min-value: 0
    max-value: 20
  system-config-cache-ttl-seconds:
    type: integer
    required: true
    create-default: 900
    min-value: 1
    max-value: 86400
  password-minimum-chars:
    type: integer
    required: true
    create-default: 12
    min-value: 1
    max-value: 256
  password-maximum-chars:
    type: integer
    required: true
    create-default: 128
    min-value: 1
    max-value: 256
  password-acceptable-crack-time-days:
    type: integer
    required: true
    create-default: 1000
    min-value: 100
    max-value: 1000000
  password-guess-per-second:
    type: integer
    required: true
    create-default: 10000
    min-value: 100
    max-value: 1000000
  password-estimate-drift-factor:
    type: decimal
    required: true
    create-default: 1.1
    min-value: 1
    max-value: 10
  audit-bulk-read-window-seconds:
    type: integer
    required: true
    create-default: 600
    min-value: 60
    max-value: 86400
  audit-bulk-read-max-searches:
    type: integer
    required: true
    create-default: 100
    min-value: 1
    max-value: 100000
