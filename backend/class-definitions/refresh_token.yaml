# Internal rotating refresh-token storage (not a product UI class).
name: refresh_token
display_name: Refresh Token
description: >
  Opaque refresh tokens stored hashed at rest. Rotated on use; revoked on logout.
attributes:
  user_id:
    type: uuid
    required: true
    references: user
  token_hash:
    type: compact_text
    required: true
    unique: true
  expires_at:
    type: datetime
    required: true
  revoked_at:
    type: datetime
    required: false
