# Change Request — Phase 1 ITSM ticket.
name: change-request
display-name: Change Request
description: >
  Planned change record with a human-friendly CHG number. Status is a free
  string in M1; documented status vocabulary (progression) is draft →
  scheduled → in-progress → implemented → closed, plus terminal off-ramp
  cancelled.
attributes:
  number:
    type: friendly-id
    required: true
    prefix: CHG
  summary:
    type: text
    required: true
  description:
    type: multiline-text
    required: false
  status:
    type: status
    required: true
    create-default: draft
  risk-score:
    # Integer 0–100 inclusive (M1 convention; not range-enforced in the compiler yet).
    type: integer
    required: false
  scheduled-start:
    type: datetime
    required: true
  scheduled-end:
    type: datetime
    required: true
  actual-start:
    type: datetime
    required: false
  actual-end:
    type: datetime
    required: false
  assigned-user-id:
    type: uuid
    required: false
    references: user
  requested-by:
    type: uuid
    required: true
    references: user
    # M1 scoped debt: baseline seed-catalog admin UUID (SEED_ADMIN_ID /
    # STUB_ACTOR_ID). Valid only when the intentional baseline seed is applied.
    # Prefer current-user substitution / FK picker when that follow-on lands —
    # do not copy this pattern to other actor-typed attributes.
    create-default: "01900000-0000-7000-8000-000000000001"
