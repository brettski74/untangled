# Change Request — Phase 1 ITSM ticket.
name: change-request
display-name: Change Request
description: >
  Planned change record with a human-friendly CHG number. Status is a free
  string in M1; documented status vocabulary (progression) is draft →
  scheduled → in-progress → implemented → closed, plus terminal off-ramp
  cancelled.
attributes:
  number:
    type: friendly-id
    required: true
    prefix: CHG
  summary:
    type: string
    required: true
  description:
    type: string
    required: false
  status:
    type: string
    required: true
  risk-score:
    # Integer 0–100 inclusive (M1 convention; not range-enforced in the compiler yet).
    type: integer
    required: false
  scheduled-start:
    type: datetime
    required: true
  scheduled-end:
    type: datetime
    required: true
  actual-start:
    type: datetime
    required: false
  actual-end:
    type: datetime
    required: false
  assigned-user-id:
    type: uuid
    required: false
    references: user
  requested-by:
    type: uuid
    required: true
    references: user
