# Compose runtime: PostgreSQL + Redis + API + web + auth.
# Local: make up (build:; COMPOSE_PROFILES=local-edge adds the HTTPS proxy).
# Rocky/GHCR: ./deploy.sh (image pins + --no-build; does not enable local-edge).
# Variable defaults preserve local-dev behaviour when no .env is present.
# Redis is ephemeral (no named volume): cache/bus consumers tolerate restart loss.
services:
  postgres:
    # Fully-qualified registry path: Rocky Podman short-name mode cannot prompt
    # in non-interactive Actions SSH (`short-name resolution enforced…`).
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-untangled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-untangled}
      POSTGRES_DB: ${POSTGRES_DB:-untangled}
    ports:
      - "${UNTANGLED_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U untangled -d untangled"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql (versioned
      # subdirs), not the old /var/lib/postgresql/data path.
      - untangled_pgdata:/var/lib/postgresql

  redis:
    # Fully-qualified: same Rocky/Podman short-name constraint as postgres.
    image: docker.io/library/redis:7-alpine
    ports:
      - "${UNTANGLED_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    image: ${UNTANGLED_API_IMAGE:-untangled-api:local}
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://untangled:untangled@postgres:5432/untangled}
      UNTANGLED_REDIS_URL: ${UNTANGLED_REDIS_URL:-redis://redis:6379/0}
      UNTANGLED_JWT_PUBLIC_KEY_PATH: /jwt/public.pem
      UNTANGLED_ACCESS_TOKEN_TTL_SECONDS: ${UNTANGLED_ACCESS_TOKEN_TTL_SECONDS:-900}
      UNTANGLED_REFRESH_TOKEN_TTL_SECONDS: ${UNTANGLED_REFRESH_TOKEN_TTL_SECONDS:-604800}
      UNTANGLED_AUDIT_LOG_DIR: ${UNTANGLED_AUDIT_LOG_DIR:-/var/log/untangled/audit}
      UNTANGLED_AUDIT_ROLLOVER_BYTES: ${UNTANGLED_AUDIT_ROLLOVER_BYTES:-1048576}
      UNTANGLED_AUDIT_ROLLOVER_SECONDS: ${UNTANGLED_AUDIT_ROLLOVER_SECONDS:-86400}
    ports:
      - "${UNTANGLED_API_HOST_PORT:-8000}:8000"
    volumes:
      # NDJSON access/security audit logs (API does not prune; forward/retain externally).
      # Multi-replica: each process writes its own files under this mount.
      # Local `make up` sets UNTANGLED_AUDIT_MOUNT=./.run/audit (bind).
      # Rocky `./deploy.sh` leaves it empty → named volume untangled_audit.
      - ${UNTANGLED_AUDIT_MOUNT:-untangled_audit}:/var/log/untangled/audit
      - ./deploy/jwt/dev-es256-public.pem:/jwt/public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: ${UNTANGLED_WEB_IMAGE:-untangled-web:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Server-side / in-network API base (Compose DNS). Browser login posts to
      # the auth service via the public origin; SSR verifies `__untangled_access`.
      UNTANGLED_API_BASE_URL: ${UNTANGLED_API_BASE_URL:-http://api:8000}
      UNTANGLED_JWT_PUBLIC_KEY_PATH: /jwt/public.pem
      # Shared Redis for future SSR bus subscribers (no DB in the web process).
      UNTANGLED_REDIS_URL: ${UNTANGLED_REDIS_URL:-redis://redis:6379/0}
      # HTTPS public origin (local Caddy / Rocky edge) — Secure cookies.
      UNTANGLED_COOKIE_SECURE: ${UNTANGLED_COOKIE_SECURE:-true}
      PORT: "3000"
    ports:
      # Local and Rocky default host 3000. Browser origin is Caddy :8443; Vite :5173 is host-dev only.
      - "${UNTANGLED_WEB_HOST_PORT:-3000}:3000"
    volumes:
      - ./deploy/jwt/dev-es256-public.pem:/jwt/public.pem:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Always started (Rocky and local). The HTTPS proxy stays local-edge-only.
  auth:
    image: ${UNTANGLED_AUTH_IMAGE:-untangled-auth:local}
    build:
      context: ./auth
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://untangled:untangled@postgres:5432/untangled}
      UNTANGLED_REDIS_URL: ${UNTANGLED_REDIS_URL:-redis://redis:6379/0}
      UNTANGLED_PUBLIC_ORIGIN: ${UNTANGLED_PUBLIC_ORIGIN:-https://localhost:8443}
      UNTANGLED_COOKIE_SECURE: ${UNTANGLED_COOKIE_SECURE:-true}
      UNTANGLED_JWT_PRIVATE_KEY_PATH: /jwt/private.pem
      UNTANGLED_JWT_PUBLIC_KEY_PATH: /jwt/public.pem
      UNTANGLED_ACCESS_TOKEN_TTL_SECONDS: ${UNTANGLED_ACCESS_TOKEN_TTL_SECONDS:-900}
      UNTANGLED_AUDIT_LOG_DIR: ${UNTANGLED_AUDIT_LOG_DIR:-/var/log/untangled/audit}
      UNTANGLED_AUDIT_ROLLOVER_BYTES: ${UNTANGLED_AUDIT_ROLLOVER_BYTES:-1048576}
      UNTANGLED_AUDIT_ROLLOVER_SECONDS: ${UNTANGLED_AUDIT_ROLLOVER_SECONDS:-86400}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-12}
      PORT: "3000"
    ports:
      # Rocky host-side edge / host-dev. Browser should still use the public origin.
      - "${UNTANGLED_AUTH_HOST_PORT:-3001}:3000"
    volumes:
      - ${UNTANGLED_AUDIT_MOUNT:-untangled_audit}:/var/log/untangled/audit
      - ./deploy/jwt/dev-es256-private.pem:/jwt/private.pem:ro
      - ./deploy/jwt/dev-es256-public.pem:/jwt/public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  proxy:
    profiles: ["local-edge"]
    image: docker.io/library/caddy:2-alpine
    environment:
      UNTANGLED_PROXY_HOST_PORT: ${UNTANGLED_PROXY_HOST_PORT:-8443}
    ports:
      - "${UNTANGLED_PROXY_HOST_PORT:-8443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/certs/dev.crt:/etc/caddy/certs/dev.crt:ro
      - ./deploy/caddy/certs/dev.key:/etc/caddy/certs/dev.key:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  untangled_pgdata:
  untangled_audit:
