# Product validation (lint + test) on PRs and main/v* pushes.
# GHCR image publish only on push to main or v* tags, after validate succeeds.
# Publish contexts must stay aligned with compose.yaml build contexts/Dockerfiles.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://untangled:untangled@127.0.0.1:5432/untangled
      UNTANGLED_REDIS_URL: redis://127.0.0.1:6379/0
      # Skip Compose db-up / redis-up; services come from containers below.
      SKIP_DB_UP: "1"
      SKIP_REDIS_UP: "1"
    services:
      postgres:
        image: docker.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: untangled
          POSTGRES_PASSWORD: untangled
          POSTGRES_DB: untangled
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U untangled -d untangled"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: docker.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint and test
        # make test-ci → make lint + SKIP_DB_UP=1 make test (Make-equivalent checks).
        run: make test-ci

  publish-api:
    name: publish untangled-api
    needs: validate
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image: ghcr.io/{repository_owner}/untangled-api
          images: ghcr.io/${{ github.repository_owner }}/untangled-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Match compose.yaml: context ./backend (Dockerfile at context root).
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-web:
    name: publish untangled-web
    needs: validate
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image: ghcr.io/{repository_owner}/untangled-web
          images: ghcr.io/${{ github.repository_owner }}/untangled-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Match compose.yaml: context repo root, dockerfile frontend/Dockerfile.
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Teammate shared Rocky wiring only — not customer environment promotion.
  # Environment `rocky9` scopes host secrets; a future `deploy-rocky10` can mirror this job.
  # Each run SSHs and provisions deploy.sh + compose.yaml + .env; no pre-placed host files required.
  # Host runs ./deploy.sh (pull/up/health/safe-migrate/regen-seed/seed). Make stays local-dev.
  # Seed passwords: regenerated on host each deploy (seed-credentials.env); never logged.
  # Never downs volumes or passes --allow-destructive.
  deploy-rocky9:
    name: deploy rocky9
    needs: [publish-api, publish-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: rocky9
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve immutable image pins
        id: pins
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          owner="${{ github.repository_owner }}"
          {
            echo "api_image=ghcr.io/${owner}/untangled-api:sha-${short_sha}"
            echo "web_image=ghcr.io/${owner}/untangled-web:sha-${short_sha}"
            echo "sha_tag=sha-${short_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy pin: sha-${short_sha}"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "DEPLOY_SSH_KEY is not set on Environment rocky9" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer pinned known_hosts from Environment variables. Temporary fallback:
          # ssh-keyscan (trust-on-first-use) when DEPLOY_KNOWN_HOSTS is unset — remove
          # once the owner configures the Environment variable.
          if [ -n "${DEPLOY_KNOWN_HOSTS}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            if [ -z "${DEPLOY_HOST}" ]; then
              echo "DEPLOY_KNOWN_HOSTS is unset and DEPLOY_HOST is missing; cannot ssh-keyscan" >&2
              exit 1
            fi
            port="${DEPLOY_PORT:-22}"
            echo "DEPLOY_KNOWN_HOSTS unset; falling back to ssh-keyscan ${DEPLOY_HOST}:${port} (TOFU)"
            if ! ssh-keyscan -p "${port}" "${DEPLOY_HOST}" > ~/.ssh/known_hosts 2>/dev/null \
              || ! grep -q -v '^#' ~/.ssh/known_hosts; then
              echo "ssh-keyscan failed; set DEPLOY_KNOWN_HOSTS on Environment rocky9 instead" >&2
              exit 1
            fi
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Write runtime .env from Environment secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UNTANGLED_JWT_SECRET: ${{ secrets.UNTANGLED_JWT_SECRET }}
          UNTANGLED_SESSION_SECRET: ${{ secrets.UNTANGLED_SESSION_SECRET }}
          UNTANGLED_COOKIE_SECURE: ${{ secrets.UNTANGLED_COOKIE_SECURE }}
          UNTANGLED_ACCESS_TOKEN_TTL_SECONDS: ${{ secrets.UNTANGLED_ACCESS_TOKEN_TTL_SECONDS }}
          UNTANGLED_REFRESH_TOKEN_TTL_SECONDS: ${{ secrets.UNTANGLED_REFRESH_TOKEN_TTL_SECONDS }}
        run: |
          # Do not echo secret values. Fail closed when required secrets are missing.
          if [ -z "${POSTGRES_PASSWORD}" ]; then
            echo "POSTGRES_PASSWORD is not set on Environment rocky9" >&2
            exit 1
          fi
          if [ -z "${UNTANGLED_JWT_SECRET}" ]; then
            echo "UNTANGLED_JWT_SECRET is not set on Environment rocky9" >&2
            exit 1
          fi
          if [ -z "${UNTANGLED_SESSION_SECRET}" ]; then
            echo "UNTANGLED_SESSION_SECRET is not set on Environment rocky9" >&2
            exit 1
          fi
          pg_user="${POSTGRES_USER:-untangled}"
          pg_db="${POSTGRES_DB:-untangled}"
          if [ -z "${DATABASE_URL}" ]; then
            DATABASE_URL="postgresql://${pg_user}:${POSTGRES_PASSWORD}@postgres:5432/${pg_db}"
          fi
          umask 077
          {
            printf 'POSTGRES_USER=%s\n' "${pg_user}"
            printf 'POSTGRES_PASSWORD=%s\n' "${POSTGRES_PASSWORD}"
            printf 'POSTGRES_DB=%s\n' "${pg_db}"
            printf 'DATABASE_URL=%s\n' "${DATABASE_URL}"
            printf 'UNTANGLED_REDIS_URL=%s\n' "${UNTANGLED_REDIS_URL:-redis://redis:6379/0}"
            printf 'UNTANGLED_JWT_SECRET=%s\n' "${UNTANGLED_JWT_SECRET}"
            printf 'UNTANGLED_SESSION_SECRET=%s\n' "${UNTANGLED_SESSION_SECRET}"
            printf 'UNTANGLED_COOKIE_SECURE=%s\n' "${UNTANGLED_COOKIE_SECURE:-true}"
            printf 'UNTANGLED_ACCESS_TOKEN_TTL_SECONDS=%s\n' "${UNTANGLED_ACCESS_TOKEN_TTL_SECONDS:-900}"
            printf 'UNTANGLED_REFRESH_TOKEN_TTL_SECONDS=%s\n' "${UNTANGLED_REFRESH_TOKEN_TTL_SECONDS:-604800}"
            printf 'UNTANGLED_API_BASE_URL=%s\n' "http://api:8000"
            printf 'UNTANGLED_WEB_HOST_PORT=%s\n' "3000"
          } > "${RUNNER_TEMP}/untangled-rocky.env"
          echo "Wrote runtime env file for remote sync (values not logged)"

      - name: Sync contract files and deploy over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          API_IMAGE: ${{ steps.pins.outputs.api_image }}
          WEB_IMAGE: ${{ steps.pins.outputs.web_image }}
        run: |
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_PORT}" ] || [ -z "${DEPLOY_USER}" ]; then
            echo "DEPLOY_HOST, DEPLOY_PORT, and DEPLOY_USER must be set as Environment rocky9 variables" >&2
            exit 1
          fi
          ssh_base=(
            -i "${HOME}/.ssh/deploy_key"
            -o "UserKnownHostsFile=${HOME}/.ssh/known_hosts"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
          )
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          echo "SSH deploy as ${remote} port ${DEPLOY_PORT}"
          echo "Pinned api=${API_IMAGE}"
          echo "Pinned web=${WEB_IMAGE}"
          echo "Provisioning ~/untangled/ on host from this commit (no pre-placed files required)"
          ssh "${ssh_base[@]}" -p "${DEPLOY_PORT}" "${remote}" \
            "mkdir -p ~/untangled && chmod 700 ~/untangled"
          scp "${ssh_base[@]}" -P "${DEPLOY_PORT}" \
            deploy.sh \
            compose.yaml \
            "${remote}:untangled/"
          ssh "${ssh_base[@]}" -p "${DEPLOY_PORT}" "${remote}" \
            "chmod 700 ~/untangled/deploy.sh"
          scp "${ssh_base[@]}" -P "${DEPLOY_PORT}" \
            "${RUNNER_TEMP}/untangled-rocky.env" \
            "${remote}:untangled/.env"
          ssh "${ssh_base[@]}" -p "${DEPLOY_PORT}" "${remote}" \
            "chmod 600 ~/untangled/.env"
          # Single host script: pull/up/health/safe-migrate/regen seed-credentials/seed.
          # Seed password values stay on the host file only; never echoed by deploy.sh or CI.
          echo "Running ./deploy.sh on host (seed credential values not logged)"
          ssh "${ssh_base[@]}" -p "${DEPLOY_PORT}" "${remote}" \
            "cd ~/untangled && ./deploy.sh --api-image $(printf %q "$API_IMAGE") --web-image $(printf %q "$WEB_IMAGE")"
