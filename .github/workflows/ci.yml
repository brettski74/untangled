# Product validation (lint + test) on PRs and main/v* pushes.
# GHCR image publish only on push to main or v* tags, after validate succeeds.
# Publish contexts must stay aligned with compose.yaml build contexts/Dockerfiles.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://untangled:untangled@127.0.0.1:5432/untangled
      # Skip Compose db-up; Postgres comes from the service container below.
      SKIP_DB_UP: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: untangled
          POSTGRES_PASSWORD: untangled
          POSTGRES_DB: untangled
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U untangled -d untangled"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint and test
        # make test-ci → make lint + SKIP_DB_UP=1 make test (Make-equivalent checks).
        run: make test-ci

  publish-api:
    name: publish untangled-api
    needs: validate
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image: ghcr.io/{repository_owner}/untangled-api
          images: ghcr.io/${{ github.repository_owner }}/untangled-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Match compose.yaml: context ./backend (Dockerfile at context root).
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-web:
    name: publish untangled-web
    needs: validate
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image: ghcr.io/{repository_owner}/untangled-web
          images: ghcr.io/${{ github.repository_owner }}/untangled-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Match compose.yaml: context repo root, dockerfile frontend/Dockerfile.
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
