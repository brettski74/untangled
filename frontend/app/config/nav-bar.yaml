# Default product nav_bar (M1). Supported section types: `class` and `object`.
# Option identity for routes is the kebab-case display_name (renames are breaking).
# Object sections use a real detail href; `id` may use `${…}` (resolved at nav load).
#
# Deferred (do not invent syntax yet):
# - Assigned to Me / Created by Me (need bind variables)
# - Upcoming / Recent Changes (need relative/elastic date expressions)
#
# Instance Git-backed override / admin editor: later; this file is the M1
# product default shipped with the frontend bundle.

nav_bar:
  - display_name: Change Requests
    section_type: class
    class: change_request
    options:
      - display_name: New
        option_type: new

      - display_name: All
        option_type: list

      - display_name: Open
        option_type: list
        predicate:
          op: and
          predicates:
            - op: ne
              attribute: status
              value: closed
            - op: ne
              attribute: status
              value: implemented
            - op: ne
              attribute: status
              value: cancelled

      - display_name: In Progress
        option_type: list
        predicate:
          op: eq
          attribute: status
          value: in-progress

      - display_name: Scheduled
        option_type: list
        predicate:
          op: eq
          attribute: status
          value: scheduled

  - display_name: Incidents
    section_type: class
    class: incident
    options:
      - display_name: New
        option_type: new

      - display_name: All
        option_type: list

      - display_name: Open
        option_type: list
        predicate:
          op: and
          predicates:
            - op: ne
              attribute: status
              value: resolved
            - op: ne
              attribute: status
              value: closed
            - op: ne
              attribute: status
              value: cancelled

      - display_name: Closed
        option_type: list
        predicate:
          op: or
          predicates:
            - op: eq
              attribute: status
              value: resolved
            - op: eq
              attribute: status
              value: closed
            - op: eq
              attribute: status
              value: cancelled

  - display_name: System Configuration
    section_type: object
    class: system_config
    id: "${system_config_id}"
